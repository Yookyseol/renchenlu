name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move site files to root
        run: |
          mkdir -p .github/workflows
          mv 网站开发/renchenlu-site/网站源码/* .
          mv 网站开发/renchenlu-site/网站源码/.* . 2>/dev/null || true
          rmdir 网站开发/renchenlu-site/网站源码 2>/dev/null || true
          rmdir 网站开发/renchenlu-site 2>/dev/null || true
          rmdir 网站开发 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
