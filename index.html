</head>
<body>

<main class="main-content" id="mainContent">

<!-- 底部导航栏 -->
<nav class="bottom-nav">
  <a href="#text" class="bottom-nav-item active" data-page="text">

  <a href="#literature" class="bottom-nav-item" data-page="literature">

<div class="loading-overlay" id="loadingOverlay">

<div class="modal-overlay" id="battleModal">
  <div class="modal-content">
    <button class="modal-close" id="battleModalClose" aria-label="关闭">关闭</button>

</div>

<script src="assets/js/app.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
