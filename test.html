<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试 - 壬辰录</title>
<style>
body { font-family: sans-serif; padding: 20px; }
.test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
</style>
</head>
<body>
<h1>测试页面 - 验证JavaScript问题</h1>

<div class="test-section">
<h2>测试1: DOM加载</h2>
<div id="test1"></div>
</div>

<div class="test-section">
<h2>测试2: 控制台输出</h2>
<p>请打开浏览器开发者工具（F12）查看Console</p>
</div>

<script>
console.log('测试页面加载成功');
console.log('window.app:', window.app);
console.log('document.getElementById("mainContent"):', document.getElementById('mainContent'));

// 测试DOM
document.getElementById('test1').innerHTML = 'DOM元素存在: ' + (document.getElementById('mainContent') ? '是' : '否');

// 测试导航
setTimeout(function() {
  console.log('当前页面:', window.location.hash);
}, 1000);
</script>

</html>
